<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oncana Survivorship Chat</title>
  <link rel="stylesheet" href="../static/css/index-style.css">
</head>

<body>

  <!-- Chat Button -->
  <button class="chat-button" id="open-chat">
    <img src="../static/images/Oncana Graphic_C_Parchment.png" alt="Chat Icon"> Need Assistance?
  </button>

  <!-- Chat Popup -->
  <div class="chat-popup" id="chat-popup">
    <div class="chat-header">
      <div class="left-header">
        <img src="../static/images/Oncana Graphic_C_Forest.png" alt="Oncana Logo">
      <span>Oncana Support</span>
      </div>
      <button id="end-chat" class="end-chat-button">End Chat</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <!-- Messages will appear here -->
    </div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button id="send-btn">Send</button>
    </div>
  </div>

 

  <!-- Script -->
  <script src="../static/js/index-script.js"></script>
</body>

</html>
